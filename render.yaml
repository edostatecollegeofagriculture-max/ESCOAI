services:
  - type: web
    name: edscoai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask init-db
    startCommand: gunicorn --workers 2 --threads 4 --timeout 90 --access-logfile - --error-logfile - --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_REQUIRE_TLS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REQUEST_BYTES
        value: 12582912
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: JWT_ACCESS_MINUTES
        value: 30
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: edscoai
